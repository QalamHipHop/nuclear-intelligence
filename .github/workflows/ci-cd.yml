name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Quality, safety, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q core api blockchain scripts core_hf.py hf_deploy/app.py

      - name: Run offline health checks
        run: python scripts/health_check.py

      - name: Run deterministic regression tests
        env:
          HF_TOKEN: ""
          GROQ_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          GEMINI_API_KEY: ""
          SYNC_TO_HF: "false"
          SYNC_TO_GITHUB: "false"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify headless runtime imports without a UI server
        env:
          HF_TOKEN: ""
          SYNC_TO_HF: "false"
          SYNC_TO_GITHUB: "false"
        run: |
          python -c "from core_hf import HeadlessHFAdapter; adapter = HeadlessHFAdapter(); assert isinstance(adapter.ready, bool); print('headless runtime ready=', adapter.ready)"
