name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf_deploy/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE_ID: Qalam/Nuclear-Intelligence
  HF_OIDC_RESOURCE: spaces/Qalam/Nuclear-Intelligence

jobs:
  deploy:
    name: Publish curated Space bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.19.0"

      - name: Verify release bundle
        run: |
          test -f hf_deploy/app.py
          test -f hf_deploy/README.md
          test -f hf_deploy/requirements.txt
          test -f hf_deploy/Dockerfile
          python -m compileall -q hf_deploy/app.py

      - name: Exchange GitHub identity for scoped Hub access
        run: |
          hf auth whoami
          echo "Keyless Hugging Face authentication succeeded for ${HF_OIDC_RESOURCE}."

      - name: Publish the Space bundle
        run: |
          hf upload "${HF_SPACE_ID}" hf_deploy . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub Actions"

      - name: Write deployment summary
        run: |
          {
            echo "## Hugging Face deployment"
            echo
            echo "- Space: https://huggingface.co/spaces/${HF_SPACE_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Authentication: GitHub OIDC → one-hour, Space-scoped credential"
          } >> "$GITHUB_STEP_SUMMARY"
