name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "hf_deploy/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE_ID: Qalam/Nuclear-Intelligence
  HF_OIDC_RESOURCE: spaces/Qalam/Nuclear-Intelligence

jobs:
  deploy:
    name: Publish curated Space bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.19.0"

      - name: Verify release bundle
        run: |
          test -f hf_deploy/app.py
          test -f hf_deploy/README.md
          test -f hf_deploy/requirements.txt
          test -f hf_deploy/Dockerfile
          python -m compileall -q hf_deploy/app.py

      - name: Authenticate for scoped Hub publishing
        env:
          HF_FALLBACK_TOKEN: ${{ secrets.HF_FALLBACK_TOKEN }}
        run: |
          set -u
          if hf auth whoami; then
            echo "Using keyless GitHub OIDC access for ${HF_OIDC_RESOURCE}."
          elif [ -n "${HF_FALLBACK_TOKEN:-}" ]; then
            echo "OIDC publisher is not configured; using the restricted fallback token."
            hf auth login --token "$HF_FALLBACK_TOKEN"
          else
            echo "No OIDC publisher or restricted fallback credential is available." >&2
            exit 1
          fi

      - name: Publish the Space bundle
        run: |
          hf upload "${HF_SPACE_ID}" hf_deploy . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${GITHUB_SHA::7} from GitHub Actions"

      - name: Write deployment summary
        run: |
          {
            echo "## Hugging Face deployment"
            echo
            echo "- Space: https://huggingface.co/spaces/${HF_SPACE_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Authentication: GitHub OIDC when configured; otherwise a repository-scoped GitHub secret used only by this ephemeral runner"
          } >> "$GITHUB_STEP_SUMMARY"
