name: Deploy Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      # Every input consumed by scripts/build_space_bundle.py must trigger a Space release.
      - "hf_deploy/**"
      - "core/**"
      - "blockchain/**"
      - "knowledge_base/**"
      - "scripts/build_space_bundle.py"
      - "core_hf.py"
      - "requirements.txt"
      - "Dockerfile"
      - "README.md"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

env:
  HF_SPACE_ID: Qalam/Nuclear-Intelligence

jobs:
  deploy:
    name: Publish curated Space bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.19.0"

      - name: Build and verify canonical Space bundle
        run: |
          python scripts/build_space_bundle.py --output .space_build
          python -m compileall -q .space_build/app.py .space_build/core_hf.py
          test -f .space_build/core/research_controller.py
          test -f .space_build/core/operation_loop_v4.py
          ! grep -q 'class NuclearIntelligenceCore' .space_build/app.py

      - name: Authenticate for scoped Hub publishing
        env:
          HF_FALLBACK_TOKEN: ${{ secrets.HF_FALLBACK_TOKEN }}
        run: |
          set -u
          if HF_OIDC_RESOURCE="spaces/${HF_SPACE_ID}" hf auth whoami; then
            echo "HF_USE_OIDC=true" >> "$GITHUB_ENV"
            echo "Using keyless GitHub OIDC access for spaces/${HF_SPACE_ID}."
          elif [ -n "${HF_FALLBACK_TOKEN:-}" ]; then
            echo "HF_USE_OIDC=false" >> "$GITHUB_ENV"
            echo "OIDC publisher is not configured; using the restricted fallback token."
            hf auth login --token "$HF_FALLBACK_TOKEN"
          else
            echo "No OIDC publisher or restricted fallback credential is available." >&2
            exit 1
          fi

      - name: Publish the Space bundle
        run: |
          if [ "${HF_USE_OIDC:-false}" = "true" ]; then
            export HF_OIDC_RESOURCE="spaces/${HF_SPACE_ID}"
          else
            unset HF_OIDC_RESOURCE
          fi
          hf upload "${HF_SPACE_ID}" .space_build . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy canonical runtime ${GITHUB_SHA::7} from GitHub Actions"

      - name: Write deployment summary
        run: |
          {
            echo "## Hugging Face deployment"
            echo
            echo "- Space: https://huggingface.co/spaces/${HF_SPACE_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Authentication: GitHub OIDC when configured; otherwise a repository-scoped GitHub secret used only by this ephemeral runner"
          } >> "$GITHUB_STEP_SUMMARY"
